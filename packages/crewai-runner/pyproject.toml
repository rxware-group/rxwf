[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crewai-runner"
version = "0.1.0"
description = "FastAPI sidecar for CrewAI workflow execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.86.0,<0.87.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crewai_runner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
