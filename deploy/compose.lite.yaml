services:
  rx-workflow:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
    ports:
      - '8787:8787'
    environment:
      RXWF_HTTP_PORT: '8787'
      RXWF_DATA_DIR: /data
      RXWF_WEBHOOK_SECRET: dev-webhook-secret
      RXWF_FEATURE_PLUS: 'true'
    volumes:
      - rxwf-data:/data

volumes:
  rxwf-data:
